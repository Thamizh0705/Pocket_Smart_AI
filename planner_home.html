{% extends "base.html" %}{% block content %}<div class="card form-card"><h1>🏠 Home Interior Planner</h1><form id="planner"><div class="field"><label>Total budget ₹</label><input name="budget" type="number" min="1" required></div><div class="field"><label>Rooms</label><div class="checks"><label><input type="checkbox" name="rooms" value="Living Room"> Living Room</label><label><input type="checkbox" name="rooms" value="Kitchen"> Kitchen</label><label><input type="checkbox" name="rooms" value="Bedroom"> Bedroom</label><label><input type="checkbox" name="rooms" value="Dining Room"> Dining Room</label></div></div><div class="field"><label>Style</label><select name="style"><option>Modern</option><option>Minimalist</option><option>Traditional</option><option>Industrial</option></select></div><div class="field"><label>Location</label><input name="location" value="India"></div><button class="btn">Generate Recommendations</button></form><div id="result" class="result hidden"></div></div>{% endblock %}{% block scripts %}<script>if(requireLogin()){document.getElementById("planner").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target);const rooms=f.getAll("rooms");if(!rooms.length){alert("Select at least one room.");return;}try{const result=await api("/api/generate-home",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({budget:Number(f.get("budget")),rooms,style:f.get("style"),location:f.get("location"),priorities:[]})});renderResult(result,document.getElementById("result"));}catch(err){alert(err.message);}});}</script>{% endblock %}
