{% extends "base.html" %}{% block content %}<div class="card form-card"><h1>Create account</h1><form id="registerForm"><div class="field"><label>Name</label><input name="name" required minlength="2"></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password (minimum 8 characters)</label><input name="password" type="password" minlength="8" required></div><button class="btn">Create Account</button></form><p id="message" class="error"></p><p>Already registered? <a href="/login">Login</a></p></div>{% endblock %}{% block scripts %}<script>document.getElementById("registerForm").addEventListener("submit",async e=>{e.preventDefault();const message=document.getElementById("message");try{const data=Object.fromEntries(new FormData(e.target));const result=await api("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});setToken(result.token);location.href="/dashboard";}catch(err){message.textContent=err.message;}});</script>{% endblock %}
