{% extends "base.html" %}{% block content %}<div class="card form-card"><h1>Login</h1><form id="loginForm"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button class="btn">Login</button></form><p id="message" class="error"></p><p>New user? <a href="/register">Create account</a></p></div>{% endblock %}{% block scripts %}<script>document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const message=document.getElementById("message");try{const data=Object.fromEntries(new FormData(e.target));const result=await api("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});setToken(result.token);location.href="/dashboard";}catch(err){message.textContent=err.message;}});</script>{% endblock %}
