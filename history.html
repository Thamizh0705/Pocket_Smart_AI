{% extends "base.html" %}{% block content %}<div class="card"><h1>Recommendation History</h1><div id="history">Loading...</div></div>{% endblock %}{% block scripts %}<script>if(requireLogin()){api("/api/history").then(rows=>{const box=document.getElementById("history");if(!rows.length){box.innerHTML="<p>No recommendations yet.</p>";return;}box.innerHTML=rows.map(r=>`<div class="rec"><b>${escapeHtml(r.planner)}</b><p>${money(r.budget)}</p><p>${escapeHtml(r.summary)}</p><a class="btn" href="/history#${r.id}">Saved #${r.id}</a></div>`).join("");}).catch(e=>document.getElementById("history").textContent=e.message);}</script>{% endblock %}
