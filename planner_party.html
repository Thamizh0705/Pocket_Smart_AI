{% extends "base.html" %}{% block content %}<div class="card form-card"><h1>🎉 Party Planner</h1><form id="planner"><div class="field"><label>Total budget ₹</label><input name="budget" type="number" min="1" required></div><div class="field"><label>Guests</label><input name="guests" type="number" min="1" required></div><div class="field"><label>Event type</label><select name="event_type"><option>Birthday</option><option>Wedding</option><option>Corporate</option><option>Engagement</option></select></div><div class="field"><label>Venue</label><input name="venue" value="Flexible"></div><div class="field"><label>Location</label><input name="location" value="India"></div><div class="field"><label>Food preference</label><select name="food_preference"><option>Mixed</option><option>Vegetarian</option><option>Vegan</option></select></div><button class="btn">Generate Recommendations</button></form><div id="result" class="result hidden"></div></div>{% endblock %}{% block scripts %}<script>if(requireLogin()){document.getElementById("planner").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target);try{const result=await api("/api/generate-party",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({budget:Number(f.get("budget")),guests:Number(f.get("guests")),event_type:f.get("event_type"),venue:f.get("venue"),location:f.get("location"),food_preference:f.get("food_preference")})});renderResult(result,document.getElementById("result"));}catch(err){alert(err.message);}});}</script>{% endblock %}
