{% extends "base.html" %}{% block content %}<div class="card form-card"><h1>💎 Jewelry Planner</h1><form id="planner"><div class="field"><label>Budget ₹</label><input name="budget" type="number" min="1" required></div><div class="field"><label>Occasion</label><input name="occasion" placeholder="Wedding, birthday, engagement" required></div><div class="field"><label>Style</label><select name="style"><option>Elegant</option><option>Traditional</option><option>Minimalist</option><option>Statement</option></select></div><div class="field"><label>Metal</label><select name="metal"><option>Any</option><option>Gold</option><option>Silver</option><option>Rose Gold</option><option>Artificial</option></select></div><div class="field"><label>Outfit description</label><textarea name="outfit_description"></textarea></div><div class="field"><label>Optional outfit image</label><input name="outfit_image" type="file" accept="image/jpeg,image/png,image/webp"></div><button class="btn">Generate Recommendations</button></form><div id="result" class="result hidden"></div></div>{% endblock %}{% block scripts %}<script>if(requireLogin()){document.getElementById("planner").addEventListener("submit",async e=>{e.preventDefault();try{const result=await api("/api/generate-jewelry",{method:"POST",body:new FormData(e.target)});renderResult(result,document.getElementById("result"));}catch(err){alert(err.message);}});}</script>{% endblock %}
